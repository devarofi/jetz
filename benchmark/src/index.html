<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Framework Benchmark - Jetz vs React vs Vue vs raw DOM</title>
    <!--
        STANDALONE BENCHMARK PAGE
        ------------------------------------------------------------------------
        Deliberately loads NOTHING over the network: no webfont, no CDN CSS, no
        analytics. Every byte the page needs is in app.bundle.js, because a
        late-loading stylesheet would reflow the table in the middle of a
        measurement and every arm would pay for it differently.

        The table CSS below is shared by all four arms, so a row costs the same
        geometry no matter which framework produced it.
    -->
    <style>
        :root {
            --page: #0a1620;
            --card: #10202c;
            --line: rgba(230, 240, 247, 0.10);
            --ink: #e6f0f7;
            --muted: #8fa8b9;
            --faint: #6d8899;
            --blue: #6cc2f2;
            --green: #4fd18b;
            --red: #ff5252;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 24px;
            background: var(--page);
            color: var(--ink);
            font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
        }

        h1 { font-size: 20px; margin: 0 0 4px; }
        h2 { font-size: 13px; margin: 0 0 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }

        .lede { color: var(--muted); margin: 0 0 20px; max-width: 78ch; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
        .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .spacer { flex: 1 1 auto; }

        button {
            font: inherit; font-size: 13px;
            color: var(--ink);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 7px 12px;
            cursor: pointer;
        }
        button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.10); }
        button:disabled { opacity: .4; cursor: not-allowed; }
        button.primary { background: rgba(108, 194, 242, .18); border-color: rgba(108, 194, 242, .45); }

        select, input {
            font: inherit; font-size: 13px;
            color: var(--ink);
            background: #0a1620;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 6px 8px;
        }

        label { color: var(--muted); font-size: 13px; }
        .status { font-size: 13px; color: var(--faint); min-height: 20px; }
        .status.busy { color: var(--blue); }
        .status.fail { color: var(--red); }

        table.results { border-collapse: collapse; width: 100%; font-size: 13px; }
        table.results caption { caption-side: top; text-align: left; color: var(--muted); font-size: 12px; padding-bottom: 6px; }
        table.results + table.results { margin-top: 18px; }
        table.results th, table.results td { padding: 7px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
        table.results th:first-child, table.results td:first-child { text-align: left; }
        table.results thead th { color: var(--faint); font-weight: 600; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
        table.results td.num { font-variant-numeric: tabular-nums; }
        table.results td.best { color: var(--green); }
        .ratio { color: var(--faint); font-size: 11px; margin-left: 4px; }
        .note { color: var(--faint); font-size: 12px; margin-top: 10px; }
        .fail-chip { color: var(--red); font-weight: 600; }
        .ok-chip { color: var(--green); }

        /* ---------------------------------------------------------------- */
        /*  RANKING                                                          */
        /* ---------------------------------------------------------------- */
        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            font-weight: 700;
            font-size: 13px;
        }
        .rank-1 { background: rgba(79, 209, 139, 0.16); color: var(--green); border: 1px solid rgba(79, 209, 139, 0.45); }
        .rank-2 { background: rgba(108, 194, 242, 0.14); color: var(--blue); border: 1px solid rgba(108, 194, 242, 0.40); }
        .rank-3 { background: rgba(230, 240, 247, 0.06); color: var(--muted); border: 1px solid var(--line); }

        .standings td:nth-child(2) { min-width: 190px; text-align: left; }
        .standings th:nth-child(2) { text-align: left; }
        .standings .sub { color: var(--faint); font-size: 11px; margin-top: 2px; }
        .bar {
            display: block;
            height: 4px;
            margin-top: 6px;
            border-radius: 2px;
            background: linear-gradient(90deg, var(--blue), var(--green));
        }
        .leader { color: var(--green); font-weight: 600; }

        /* ---------------------------------------------------------------- */
        /*  THE BENCHMARK TABLE - shared by every arm                        */
        /* ---------------------------------------------------------------- */
        /*
           Measured off-screen on purpose. Paint is the last step of every
           operation and it is identical markup for all four arms, so leaving
           the table visible adds a constant 300-600 ms to the heaviest ops and
           compresses the differences being compared. Laid out, never painted.
           Fixed width so the table algorithm sees the same box every time.
        */
        .arena {
            position: fixed;
            top: 0;
            left: -99999px;
            width: 1200px;
        }

        table.bench {
            /* Fixed layout keeps the browser's table algorithm out of the
               comparison: auto layout costs ~1.3 s over 10,000 rows here, which
               is three times the cost of building the DOM and identical for every
               arm — so it would only bury the numbers being compared. */
            table-layout: fixed;
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
        }
        table.bench td { border-bottom: 1px solid var(--line); padding: 4px 8px; white-space: nowrap; }
        table.bench td.col1 { width: 15%; }
        table.bench td.col-md-hidden { width: 20%; }
        table.bench td.col-sm-hidden { width: 8%; }
        table.bench a { color: var(--blue); text-decoration: none; }
        table.bench .pre, table.bench .post { color: var(--faint); }
        table.bench tr.danger td.col1 a { color: var(--red); font-weight: 700; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="./app.bundle.js"></script>
</body>
</html>
